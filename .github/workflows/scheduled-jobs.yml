# Runs the app's scheduled jobs. Vercel's free plan only allows one cron a day,
# so GitHub does the scheduling instead (free for a public repository).
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions → New
# repository secret:
#   SITE_URL     the public address, e.g. https://jammu-genetics-hub.vercel.app
#   CRON_SECRET  any long random text; set the SAME value as CRON_SECRET in Vercel
# Until both exist the job exits quietly without doing anything.
#
# Note: GitHub pauses scheduled workflows after 60 days with no activity in the
# repository — pushing any change (or pressing "Run workflow") wakes it again.

name: Scheduled jobs

on:
  schedule:
    - cron: "30 2 * * *" # 02:30 UTC = 08:00 India time
  workflow_dispatch:

permissions: {}

jobs:
  daily-digest:
    name: Morning summary to the owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the daily digest
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::SITE_URL / CRON_SECRET secrets are not set yet - skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 90 --retry 2 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/daily-digest"
